<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio | E-Ink Experience</title>
  <meta name="description" content="Minimalist e-ink portfolio featuring interactive fluid ink animations.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Animated E-Ink Background Canvas -->
  <canvas id="c"></canvas>

  <!-- E-Ink Floating Navbar Container -->
  <header class="navbar-container">
    <nav class="eink-navbar" aria-label="Main Navigation">

      <!-- Brand Logo / Monogram -->
      <a href="#home" class="nav-brand" aria-label="Home">
        <span class="brand-dot"></span>
        <span>FNZ</span>
        <span class="brand-tag">78</span>
      </a>

      <!-- Navigation Links -->
      <ul class="nav-links" id="navLinks">
        <li><a href="#home" class="nav-link active">Home</a></li>
        <li><a href="#about" class="nav-link">About</a></li>
        <li><a href="#projects" class="nav-link">Work</a></li>
        <li><a href="#experience" class="nav-link">Experience</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>

      <!-- Right Controls & Status -->
      <div class="nav-controls">

        <!-- Refresh Flash Button -->
        <button id="refreshBtn" class="eink-btn" title="Trigger E-Ink Flash Refresh" aria-label="Refresh E-Ink Display">
          <svg class="eink-btn-icon" viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
          </svg>
        </button>

        <!-- Theme Toggle Button -->
        <button id="themeToggle" class="eink-btn" title="Toggle Theme" aria-label="Toggle Light/Dark Theme">
          <svg class="eink-btn-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </button>

        <!-- E-Ink Clock Status Display -->
        <div class="eink-status">
          <span class="eink-status-time" id="einkClock">--:--</span>
        </div>

        <!-- Mobile Menu Hamburger Button -->
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Navigation Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
          </svg>
        </button>

      </div>
    </nav>
  </header>

  <!-- Main Scrollable Content Container -->
  <main class="main-content">

    <!-- Contact Section -->
    <section id="contact" class="portfolio-section">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-dot"></span>
          <span>LET'S CONNECT</span>
        </h2>
        <p class="section-subtitle">Open to opportunities, collaborations, and interesting projects.</p>
      </div>

      <!-- Contact E-Ink Card -->
      <div class="eink-card">

        <!-- Error Banner -->
        <div id="formErrorBanner" class="form-error-banner" role="alert"></div>

        <!-- Formspree Contact Form -->
        <form id="contactForm" action="https://formspree.io/f/mdekbvjj" method="POST" novalidate>

          <!-- Anti-Spam Honeypot Field (Security) -->
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none !important">

          <div class="form-grid">

            <!-- Full Name -->
            <div class="form-group">
              <label for="name" class="form-label">
                <span>FULL NAME</span>
                <span class="required-star">*</span>
              </label>
              <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Farhan Nazim" required data-fs-field>
              <span class="form-error-text" data-fs-error="name"></span>
            </div>

            <!-- Email Address -->
            <div class="form-group">
              <label for="email" class="form-label">
                <span>EMAIL ADDRESS</span>
                <span class="required-star">*</span>
              </label>
              <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required data-fs-field>
              <span class="form-error-text" data-fs-error="email"></span>
            </div>

            <!-- Message Content -->
            <div class="form-group full-width">
              <label for="message" class="form-label">
                <span>YOUR MESSAGE</span>
                <span class="required-star">*</span>
              </label>
              <textarea id="message" name="message" class="form-textarea" rows="5" placeholder="Share details about your idea or project..." required data-fs-field></textarea>
              <span class="form-error-text" data-fs-error="message"></span>
            </div>

          </div>

          <!-- Submit Action -->
          <div style="margin-top: 1.5rem; text-align: right;">
            <button type="submit" class="eink-submit-btn" data-fs-submit-btn>
              <span class="btn-dot">●</span>
              <span>SEND MESSAGE</span>
            </button>
          </div>

        </form>

        <!-- Success Banner -->
        <div id="formSuccessBanner" class="form-success-banner" data-fs-success>
          <div class="success-icon">✦</div>
          <h3 class="success-title">MESSAGE TRANSMITTED</h3>
          <p class="success-desc">Thank you for reaching out! I have received your note and will get back to you shortly.</p>
          <button id="resetFormBtn" class="eink-submit-btn" style="box-shadow: none;">
            <span>SEND ANOTHER MESSAGE</span>
          </button>
        </div>

      </div>

      <!-- Quick Contact SVG Outline Icon Buttons -->
      <div class="contact-social-row" aria-label="Direct Contact Icons">
        <!-- Direct Email -->
        <a href="mailto:farhannazimfnz@gmail.com" class="social-icon-btn large" aria-label="Direct Email" data-tooltip="farhannazimfnz@gmail.com">
          <svg class="social-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z M22 6l-10 7L2 6"/></svg>
        </a>

        <!-- Phone -->
        <a href="tel:+916238688556" class="social-icon-btn large" aria-label="Phone" data-tooltip="+91 6238688556">
          <svg class="social-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </a>

        <!-- GitHub -->
        <a href="https://github.com/fnz78" target="_blank" rel="noopener noreferrer" class="social-icon-btn large" aria-label="GitHub" data-tooltip="github.com/fnz78">
          <svg class="social-icon" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/k-n-farhan-nazim-402122306/" target="_blank" rel="noopener noreferrer" class="social-icon-btn large" aria-label="LinkedIn" data-tooltip="LinkedIn Profile">
          <svg class="social-icon" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 2a2 2 0 1 1-2 2 2 2 0 0 1 2-2z"/></svg>
        </a>
      </div>

    </section>

  </main>

      <a href="#home" class="footer-brand" aria-label="FNZ Home">

        </a>
      </div>

      <!-- Copyright / Metadata -->
      <div class="footer-meta">
        <span>© 2026 FNZ</span>
      </div>

    </div>
  </footer>
